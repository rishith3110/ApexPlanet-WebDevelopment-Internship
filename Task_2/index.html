<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 Advanced</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

:root{
    --bg: linear-gradient(135deg,#667eea,#764ba2);
    --card: rgba(255,255,255,0.2);
    --text:#fff;
}

.dark{
    --bg: linear-gradient(135deg,#232526,#414345);
    --card: rgba(0,0,0,0.3);
    --text:#fff;
}

body{
    height:100vh;
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    transition:0.5s;
}

.container{
    width:95%;
    max-width:1100px;
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    background:var(--card);
    color:var(--text);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    animation:fade 1s ease;
}

header{
    grid-column:span 2;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:22px;
}

.toggle{
    padding:8px 15px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.card{
    padding:20px;
    border-radius:15px;
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00c6ff;
    color:white;
    margin-top:5px;
}

.task{
    display:flex;
    justify-content:space-between;
    background:#00c6ff;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

.task span{
    flex:1;
}

.delete{
    background:red;
    border:none;
    padding:5px 10px;
    border-radius:5px;
    color:white;
}

#error{
    font-size:14px;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🚀 Advanced Task 2</h1>
    <button class="toggle" onclick="toggleMode()">🌙 Mode</button>
</header>

<div class="card">
    <h2>📩 Contact Form</h2>
    <form id="form">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <button type="submit">Submit</button>
        <p id="error"></p>
    </form>
</div>

<div class="card">
    <h2>📝 To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter Task">
    <button onclick="addTask()">Add Task</button>
    <div id="taskList"></div>
</div>

</div>

<script>
function toggleMode(){
    document.body.classList.toggle("dark");
}

document.getElementById("form").addEventListener("submit",function(e){
    e.preventDefault();

    let name=document.getElementById("name").value.trim();
    let email=document.getElementById("email").value.trim();
    let error=document.getElementById("error");

    let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if(name===""||email===""){
        error.style.color="red";
        error.innerText="All fields required!";
    }
    else if(!email.match(emailPattern)){
        error.style.color="red";
        error.innerText="Invalid Email!";
    }
    else{
        error.style.color="lightgreen";
        error.innerText="Form Submitted Successfully!";
    }
});

window.onload=function(){
    let tasks=JSON.parse(localStorage.getItem("tasks"))||[];
    tasks.forEach(t=>createTask(t));
}

function addTask(){
    let input=document.getElementById("taskInput");
    let task=input.value.trim();
    if(task==="") return;

    createTask(task);

    let tasks=JSON.parse(localStorage.getItem("tasks"))||[];
    tasks.push(task);
    localStorage.setItem("tasks",JSON.stringify(tasks));

    input.value="";
}

function createTask(task){
    let div=document.createElement("div");
    div.className="task";

    let span=document.createElement("span");
    span.innerText=task;

    let btn=document.createElement("button");
    btn.innerText="X";
    btn.className="delete";

    btn.onclick=function(){
        div.remove();
        removeFromStorage(task);
    }

    div.appendChild(span);
    div.appendChild(btn);

    document.getElementById("taskList").appendChild(div);
}

function removeFromStorage(task){
    let tasks=JSON.parse(localStorage.getItem("tasks"))||[];
    tasks=tasks.filter(t=>t!==task);
    localStorage.setItem("tasks",JSON.stringify(tasks));
}
</script>

</body>
</html>
