<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Web Dev Journey</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.container {
    margin-top: 80px;
    padding: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.1);
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    margin: auto;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

h1 {
    margin-bottom: 10px;
}

p {
    font-size: 16px;
}

img {
    width: 120px;
    border-radius: 50%;
    margin: 15px 0;
    border: 3px solid white;
}

a {
    display: inline-block;
    margin: 10px;
    color: #ffd369;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #ffd369;
    color: black;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ffb347;
}
</style>

</head>

<body>

<div class="container">
    <div class="card">
        <h1>Hi, I'm Rishi 👋</h1>
        <p>Aspiring Web Developer 🚀</p>

        <img src="yourphoto.jpg" alt="My Profile">

        <p>I am learning HTML, CSS & JavaScript and building my first project!</p>

        <a href="https://github.com/rishith3110" target="_blank">🌐 GitHub</a>
        <a href="https://www.linkedin.com/in/rishith-kulkarni-bb2a6a332/" target="_blank">💼 LinkedIn</a>

        <br>

        <button onclick="showMessage()">Click Me ✨</button>
    </div>
</div>

<script>
function showMessage() {
    alert("🚀 Welcome to my first web project!");
}
</script>

</body>
</html>
